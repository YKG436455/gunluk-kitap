name: Günlük Excel Dersi

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt
      
      - name: Excel dersi gönder
        run: python excel_dersleri.py
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      
      - name: İlerlemeyi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add excel_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Excel ilerlemesi güncellendi [skip ci]"
          git push
